name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl: ['5.34', '5.36', '5.38', '5.40']
        rust: ['stable', 'beta']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ matrix.perl }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          perl -v | head -2
          perl -MConfig -e 'print "archname=$Config{archname}\n"'

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run tests
        run: cargo test --workspace --lib --verbose

      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace -- -D warnings || true

  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install Rust 1.85 (MSRV for edition 2024)
        uses: dtolnay/rust-action@stable
        with:
          toolchain: '1.85'

      - name: Build with MSRV
        run: cargo build --workspace
