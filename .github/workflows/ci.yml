name: CI

on:
  push:
    branches: [master, main, 'claude/**']
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==========================================================================
  # Rust library build and test
  # ==========================================================================
  build:
    name: Build and Test (Rust)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl: ['5.34', '5.36', '5.38', '5.40']
        rust: ['stable', 'beta']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ matrix.perl }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          perl -v | head -2
          perl -MConfig -e 'print "archname=$Config{archname}\n"'

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run Rust library tests
        run: cargo test --workspace --lib --verbose

      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace -- -D warnings || true

  # ==========================================================================
  # Perl integration tests
  # ==========================================================================
  perl-integration:
    name: Perl Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.34', '5.36', '5.38', '5.40']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            t/target/
          key: ${{ runner.os }}-perl-integration-${{ matrix.perl }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Perl test dependencies
        run: |
          cpanm --notest Module::Install
          cpanm --notest Module::Install::Rust
          cpanm --notest Test::LeakTrace
          cpanm --notest Test::More
          cpanm --notest Test::Fatal

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          perl -v | head -2
          perl -MConfig -e 'print "archname=$Config{archname}\n"'
          perl -MModule::Install -e 'print "Module::Install $Module::Install::VERSION\n"' || echo "Module::Install not available"
          perl -MModule::Install::Rust -e 'print "Module::Install::Rust $Module::Install::Rust::VERSION\n"' || echo "Module::Install::Rust not available (will be used during build)"

      - name: Build Rust workspace
        run: cargo build --workspace --release

      - name: Build XSTest module
        working-directory: t
        run: |
          perl Makefile.PL
          echo "=== Generated Cargo.toml ==="
          cat Cargo.toml || echo "No Cargo.toml found"
          echo "=== Building... ==="
          make VERBOSE=1

      - name: Debug - Check built files
        working-directory: t
        run: |
          echo "=== blib contents ==="
          find blib -type f 2>/dev/null || echo "No blib directory"
          echo "=== .so files ==="
          find . -name "*.so" -o -name "*.dylib" 2>/dev/null || echo "No shared library files"
          echo "=== XSTest.pm location ==="
          find . -name "XSTest.pm" 2>/dev/null
          echo "=== Check for boot symbol ==="
          for so in $(find . -name "*.so" 2>/dev/null); do
            echo "Symbols in $so:"
            nm -D "$so" 2>/dev/null | grep -E "boot_|XSTest" || echo "No boot symbol found"
          done
          echo "=== Try loading module ==="
          perl -Mblib -e 'eval { require XSTest; print "Module loaded OK\n"; 1 } or print "Failed to load: $@\n"'
          echo "=== Check @INC ==="
          perl -Mblib -e 'print join("\n", @INC), "\n"'

      - name: Run Perl integration tests
        working-directory: t
        run: make test

      - name: Run individual test files with verbose output
        working-directory: t
        if: failure()
        run: |
          for test in t/*.t; do
            echo "=== Running $test ==="
            perl -Mblib $test || true
          done

  # ==========================================================================
  # Test specific functionality groups
  # ==========================================================================
  test-features:
    name: Test Features (${{ matrix.feature }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        feature:
          - scalars
          - arrays
          - hashes
          - roundtrip
          - objects
          - derive
    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl 5.38
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            t/target/
          key: ${{ runner.os }}-features-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Perl test dependencies
        run: |
          cpanm --notest Module::Install Module::Install::Rust Test::LeakTrace Test::More Test::Fatal

      - name: Build workspace and XSTest
        run: |
          cargo build --workspace --release
          cd t && perl Makefile.PL && make

      - name: Run scalar tests
        if: matrix.feature == 'scalars'
        working-directory: t
        run: |
          prove -v t/scalar-*.t

      - name: Run array tests
        if: matrix.feature == 'arrays'
        working-directory: t
        run: |
          prove -v t/array.t

      - name: Run hash tests
        if: matrix.feature == 'hashes'
        working-directory: t
        run: |
          prove -v t/hash.t

      - name: Run roundtrip tests
        if: matrix.feature == 'roundtrip'
        working-directory: t
        run: |
          prove -v t/roundtrip.t

      - name: Run object/data tests
        if: matrix.feature == 'objects'
        working-directory: t
        run: |
          prove -v t/data.t

      - name: Run derive macro tests
        if: matrix.feature == 'derive'
        working-directory: t
        run: |
          prove -v t/derive.t

  # ==========================================================================
  # MSRV check
  # ==========================================================================
  msrv:
    name: Minimum Supported Rust Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install Rust 1.85 (MSRV for edition 2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'

      - name: Build with MSRV
        run: cargo build --workspace

  # ==========================================================================
  # Memory leak detection
  # ==========================================================================
  memory-leaks:
    name: Memory Leak Detection
    runs-on: ubuntu-latest
    needs: [perl-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Perl 5.38
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            t/target/
          key: ${{ runner.os }}-leaks-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Perl test dependencies
        run: |
          cpanm --notest Module::Install Module::Install::Rust Test::LeakTrace Test::More Test::Fatal

      - name: Build workspace and XSTest
        run: |
          cargo build --workspace --release
          cd t && perl Makefile.PL && make

      - name: Run leak tests
        working-directory: t
        run: |
          # Run all tests that use Test::LeakTrace
          for test in t/*.t; do
            if grep -q "Test::LeakTrace" "$test"; then
              echo "=== Running leak tests in $test ==="
              perl -Mblib "$test"
            fi
          done

  # ==========================================================================
  # Summary job for branch protection
  # ==========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [build, perl-integration, msrv]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build job failed"
            exit 1
          fi
          if [[ "${{ needs.perl-integration.result }}" != "success" ]]; then
            echo "Perl integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.msrv.result }}" != "success" ]]; then
            echo "MSRV check failed"
            exit 1
          fi
          echo "All required jobs passed!"
