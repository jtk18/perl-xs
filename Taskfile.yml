version: '3'

vars:
  PERL_VERSION:
    sh: perl -v | grep -oP 'v\d+\.\d+\.\d+' | head -1

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build the perl-xs workspace
    cmds:
      - cargo build --workspace
    sources:
      - src/**/*.rs
      - perl-sys/src/**/*.rs
      - perlxs_derive/src/**/*.rs
      - Cargo.toml
      - perl-sys/Cargo.toml
      - perlxs_derive/Cargo.toml

  build-release:
    desc: Build the workspace in release mode
    cmds:
      - cargo build --workspace --release

  test:
    desc: Run all Rust tests
    deps: [build]
    cmds:
      - cargo test --workspace --lib

  test-verbose:
    desc: Run tests with verbose output
    deps: [build]
    cmds:
      - cargo test --workspace --lib -- --nocapture

  clean:
    desc: Clean build artifacts
    cmds:
      - cargo clean
      - rm -rf perl-sys/target

  regen:
    desc: Regenerate perl-sys bindings
    dir: perl-sys
    cmds:
      - cargo clean
      - cargo build

  doc:
    desc: Generate documentation
    cmds:
      - cargo doc --workspace --no-deps

  doc-open:
    desc: Generate and open documentation
    cmds:
      - cargo doc --workspace --no-deps --open

  check:
    desc: Run cargo check
    cmds:
      - cargo check --workspace

  clippy:
    desc: Run clippy linter
    cmds:
      - cargo clippy --workspace -- -W clippy::all

  fmt:
    desc: Format code
    cmds:
      - cargo fmt --all

  fmt-check:
    desc: Check code formatting
    cmds:
      - cargo fmt --all -- --check

  info:
    desc: Show build environment info
    cmds:
      - echo "Rust version:" && rustc --version
      - echo "Cargo version:" && cargo --version
      - echo "Perl version:" && perl -v | head -2
      - echo "Perl config:" && perl -MConfig -e 'print "archname=$Config{archname}\nusemultiplicity=$Config{usemultiplicity}\nuseithreads=$Config{useithreads}\n"'

  install-deps:
    desc: Install required Perl test dependencies (requires CPAN)
    cmds:
      - |
        echo "Installing Perl test dependencies..."
        cpan Module::Install Module::Install::Rust Test::LeakTrace Test::More Test::Fatal

  perl-test:
    desc: Run Perl integration tests (requires Module::Install::Rust)
    dir: t
    deps: [build]
    cmds:
      - perl Makefile.PL
      - make
      - make test

  example:
    desc: Build examples
    cmds:
      - cargo build --workspace --examples

  ci:
    desc: Run all CI checks
    cmds:
      - task: fmt-check
      - task: check
      - task: clippy
      - task: test
